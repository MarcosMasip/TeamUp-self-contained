###############################################
# Corrected SSL & application configuration   #
# (Previously lines were broken across wraps) #
###############################################

# HTTPS / SSL
server.ssl.enabled=true
security.require.ssl=true
server.port=8443
server.ssl.key-store=classpath:teamup.p12
server.ssl.key-store-password=teamup
server.ssl.key-store-type=PKCS12
server.ssl.keyAlias=teamup

# Error handling
server.error.include-message=always

## JWT secret now sourced from environment variable APP_JWT_SECRET (fallback to dev value if unset)
application.jwt.secretKey=${APP_JWT_SECRET:dev-default-insecure-change-me}
application.jwt.tokenPrefix=Bearer
application.jwt.tokenExpirationAfterDays=7

# Database (Docker default points to service name 'db')
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://db:5432/app
spring.datasource.username=postgres
spring.datasource.password=root

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# API context path
server.servlet.context-path=/api

# Multipart
spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=35MB

# (Optional) Disable whitelabel error page
#server.error.whitelabel.enabled=false
#server.error.path=/error

# If needed, you can exclude ErrorMvcAutoConfiguration
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration


