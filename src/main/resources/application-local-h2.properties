spring.datasource.url=jdbc:h2:mem:teamup;DB_CLOSE_DELAY=-1
# Removed MODE=PostgreSQL to allow standard BLOB column creation for FileDB.data
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
# 48-byte Base64 (>=256 bits raw) development key; replace via APP_JWT_SECRET in production
application.jwt.secretKey=RDa+FFPsrZlEGeeYkI9tOZ5t/HokLHyhTLf34BUjCD8g/SKSKixN27FUbS/fLWbU
server.port=8443
# Use HTTPS like the main profile (inherits keystore settings from application.properties)
# (Removed overrides that disabled SSL to prevent HTTP->HTTPS redirect with broken target)
logging.level.org.springframework.security=DEBUG
